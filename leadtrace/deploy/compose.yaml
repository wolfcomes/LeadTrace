name: leadtrace

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      frontend-dev:
        condition: service_started
    ports:
      - "${LEADTRACE_PORT:-8876}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/tls:/etc/nginx/tls:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      edge:
      backend:
        ipv4_address: 172.30.97.10

  frontend-dev:
    image: node:20.19-alpine
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    volumes:
      - ../frontend:/app:ro
      - frontend_modules:/app/node_modules
    expose:
      - "5173"
    networks:
      - edge

  migrate:
    build:
      context: ../backend
    restart: "no"
    command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      LEADTRACE_DATABASE_URL: postgresql+psycopg://leadtrace:${POSTGRES_PASSWORD:-leadtrace-development-only}@postgres/leadtrace
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  web:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      LEADTRACE_ENVIRONMENT: development
      LEADTRACE_DATABASE_URL: postgresql+psycopg://leadtrace:${POSTGRES_PASSWORD:-leadtrace-development-only}@postgres/leadtrace
      LEADTRACE_REDIS_URL: redis://redis:6379/0
      LEADTRACE_SESSION_SECRET: ${LEADTRACE_SESSION_SECRET:-development-only-not-for-production}
      LEADTRACE_DEFAULT_ACCOUNT_PASSWORD: ${LEADTRACE_DEFAULT_ACCOUNT_PASSWORD:-}
      LEADTRACE_METRICS_BEARER_TOKEN: ${LEADTRACE_METRICS_BEARER_TOKEN:-development-metrics-token-not-for-production}
      LEADTRACE_HTTPS_ENABLED: "true"
      LEADTRACE_ALLOWED_HOSTS: '${LEADTRACE_ALLOWED_HOSTS:-["localhost","127.0.0.1","leadtrace.lan"]}'
      LEADTRACE_TRUSTED_PROXY_ADDRESSES: '["172.30.97.10"]'
      LEADTRACE_ASSET_ROOT: /var/lib/leadtrace/assets
      LEADTRACE_SOURCE_ROOTS: '${LEADTRACE_SOURCE_ROOTS:-{"source_pdfs":"/var/lib/leadtrace/source_pdfs"}}'
      LEADTRACE_AI_PREFILL_ENGINE: ${LEADTRACE_AI_PREFILL_ENGINE:-legacy_pipeline}
      LEADTRACE_AI_PREFILL_ENGINE_VERSION: ${LEADTRACE_AI_PREFILL_ENGINE_VERSION:-pilot-v1}
      LEADTRACE_NGINX_INTERNAL_TRANSFER: ${LEADTRACE_NGINX_INTERNAL_TRANSFER:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - leadtrace_assets:/var/lib/leadtrace/assets:ro
      - ${LEADTRACE_SOURCE_PDFS_HOST_ROOT:-../../source_pdfs}:/var/lib/leadtrace/source_pdfs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - edge
      - backend

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "--prefetch-multiplier=1"]
    environment:
      LEADTRACE_ENVIRONMENT: development
      LEADTRACE_DATABASE_URL: postgresql+psycopg://leadtrace:${POSTGRES_PASSWORD:-leadtrace-development-only}@postgres/leadtrace
      LEADTRACE_REDIS_URL: redis://redis:6379/0
      LEADTRACE_SESSION_SECRET: ${LEADTRACE_SESSION_SECRET:-development-only-not-for-production}
      LEADTRACE_ALLOWED_HOSTS: '${LEADTRACE_ALLOWED_HOSTS:-["localhost","127.0.0.1","leadtrace.lan"]}'
      LEADTRACE_ASSET_ROOT: /var/lib/leadtrace/assets
      LEADTRACE_SOURCE_ROOTS: '${LEADTRACE_SOURCE_ROOTS:-{"source_pdfs":"/var/lib/leadtrace/source_pdfs"}}'
      LEADTRACE_AI_PREFILL_ENGINE: ${LEADTRACE_AI_PREFILL_ENGINE:-legacy_pipeline}
      LEADTRACE_AI_PREFILL_ENGINE_VERSION: ${LEADTRACE_AI_PREFILL_ENGINE_VERSION:-pilot-v1}
      LEADTRACE_AI_PREFILL_LEGACY_ROOT: /var/lib/leadtrace/legacy
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - leadtrace_assets:/var/lib/leadtrace/assets
      - ${LEADTRACE_AI_PREFILL_LEGACY_HOST_ROOT:-../../source_pdfs/分子修改提取_2024_JMC}:/var/lib/leadtrace/legacy:ro
      - ${LEADTRACE_SOURCE_PDFS_HOST_ROOT:-../../source_pdfs}:/var/lib/leadtrace/source_pdfs:ro
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker:celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 8s
      retries: 4
      start_period: 20s
    networks:
      - backend

  scheduler:
    build:
      context: ../backend
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command: ["celery", "-A", "app.worker:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      LEADTRACE_ENVIRONMENT: development
      LEADTRACE_DATABASE_URL: postgresql+psycopg://leadtrace:${POSTGRES_PASSWORD:-leadtrace-development-only}@postgres/leadtrace
      LEADTRACE_REDIS_URL: redis://redis:6379/0
      LEADTRACE_SESSION_SECRET: ${LEADTRACE_SESSION_SECRET:-development-only-not-for-production}
      LEADTRACE_ALLOWED_HOSTS: '${LEADTRACE_ALLOWED_HOSTS:-["localhost","127.0.0.1","leadtrace.lan"]}'
      LEADTRACE_ASSET_ROOT: /var/lib/leadtrace/assets
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadtrace
      POSTGRES_USER: leadtrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leadtrace-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadtrace -d leadtrace"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - backend

networks:
  edge:
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.97.0/24

volumes:
  frontend_modules:
  leadtrace_assets:
  postgres_data:
  redis_data:
