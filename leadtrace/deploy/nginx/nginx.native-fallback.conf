server {
    listen 8876 ssl;
    server_name _;

    ssl_certificate /etc/nginx/tls/leadtrace.crt;
    ssl_certificate_key /etc/nginx/tls/leadtrace.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LeadTraceTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 10m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /internal/metrics {
        return 404;
    }

    # This configuration is used only for a controlled route fallback. It does
    # not restore, delete, or otherwise change LeadTrace database revisions.
    location / {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
