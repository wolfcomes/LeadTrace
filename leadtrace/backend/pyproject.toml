[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leadtrace-backend"
version = "0.1.0"
description = "LeadTrace API and background-worker foundation"
requires-python = ">=3.12"
dependencies = [
  "celery>=5.4,<6",
  "fastapi>=0.115,<0.116",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "redis>=5,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "anyio>=4.4,<4.15",
  "httpx>=0.27,<0.29",
  "pillow>=10,<13",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["../.."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
