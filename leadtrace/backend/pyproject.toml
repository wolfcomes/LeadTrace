[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leadtrace-backend"
version = "0.1.0"
description = "LeadTrace API and background-worker foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=23.1,<26",
  "celery>=5.4,<6",
  "fastapi>=0.115,<0.116",
  "pillow>=10,<13",
  "psycopg[binary]>=3.2,<4",
  "pymupdf>=1.25,<2",
  "pydantic-settings>=2.6,<3",
  "rdkit>=2024.9,<2026",
  "redis>=5,<7",
  "SQLAlchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "anyio>=4.4,<4.15",
  "httpx>=0.27,<0.29",
  "pytest>=8,<10",
  "PyYAML>=6,<7",
]
load = [
  "locust>=2.32,<3",
]

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib"
pythonpath = ["../.."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
